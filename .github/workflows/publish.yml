name: Publish Ka packages

# Release flow, triggered on any v* tag push:
#
#   npm version <patch|minor> --workspaces --include-workspace-root=false --no-git-tag-version
#   git commit -am "release vX.Y.Z" && git tag vX.Y.Z && git push --follow-tags
#
# Publishes every public workspace package to GitHub Packages. Needs the GH_PAT
# repository secret (a token with write:packages), same as archaea-ui.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@holmes89'

      - name: Install, check, build
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Check tag matches package versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for pkg in packages/*/package.json; do
            PKG_VERSION=$(node -p "require('./$pkg').version")
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "$pkg version ($PKG_VERSION) != tag ($TAG_VERSION)" >&2
              exit 1
            fi
          done

      - name: Publish packages
        run: npm publish --workspaces
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT }}
